[project]
name = "quic-multistream-research"
version = "1.0.0"
description = "QUIC Multi-Stream Research Project - Investigating QUIC parameter effects on performance metrics"
requires-python = ">=3.10"
dependencies = [
    "aioquic>=1.0.0",
    "cryptography>=41.0.0",
    "pandas>=2.0.0",
]

[project.scripts]
quic-research = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "synthesizers", "metrics", "simulation", "grid_search", "results"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
