# Multi-container deployment for the QUIC 3-Connection System.
#
# Why three containers
#   Shaping both directions of traffic realistically requires the two endpoints
#   to be separated. A single container can only shape its own egress, so
#   upload and download would share one constraint. Splitting server from
#   clients lets each shape its own egress:
#
#     server  (192.168.200.10)  shapes the download direction, runs the QUIC
#                               server, and exposes the :9001 control endpoint
#                               so slider changes reach this side too
#     clients (192.168.200.20)  shapes the upload direction, runs the three
#                               worker connections and the dashboard on :8000
#     prober  (192.168.200.30)  independent ICMP probe of the same path,
#                               giving an outside view of RTT that is not
#                               distorted by the connections' own queueing
#
# A fixed 192.168.200.0/24 bridge network is used so the containers can address
# each other by stable IP, which SERVER_CONTROL_URL and the client --server
# argument both depend on.
#
# The server runs privileged (tc requires it); clients need only NET_ADMIN.
#
# Configuration via environment variables
#   SCENARIO      wireless scenario name     (default congested_low)
#   DURATION      run length in seconds      (default 30)
#   ML_AGENT      default | andy | hybrid    (default default)
#   CLEAR_QTABLE  set to 1 to discard prior Q-learning state
#
# Usage
#   docker compose up
#   SCENARIO=lossy DURATION=120 docker compose up
#   ML_AGENT=andy DURATION=600 docker compose up
#
# Results are written to ./results/ on the host; the dashboard is at
# http://localhost:8000

services:
  # QUIC Server - accepts connections and applies bottleneck
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: quic-wireless
    container_name: quic-server
    privileged: true  # Required for tc commands
    networks:
      quic-net:
        ipv4_address: 192.168.200.10
    volumes:
      - ./results:/app/3_conn_code/output  # Shared volume for server metrics export
    environment:
      - RUN_MODE=server
      - SKIP_VETH=0  # Enable veth for bottleneck
      - SCENARIO=${SCENARIO:-congested_low}
    command: python -m main server --duration ${DURATION:-30} --scenario ${SCENARIO:-congested_low}
    
  # QUIC Clients - 3 worker processes connecting to server
  clients:
    image: quic-wireless
    container_name: quic-clients
    cap_add:
      - NET_ADMIN
    depends_on:
      - server
    ports:
      - "8000:8000"  # Expose UI port to host
    networks:
      quic-net:
        ipv4_address: 192.168.200.20
    volumes:
      - ./results:/app/3_conn_code/output
      - ./results:/app/3_conn_code/reports
    environment:
      - RUN_MODE=clients
      - SKIP_VETH=1  # Skip veth setup in client mode
      - ENABLE_NETWORK_RTT_PROBE=0  # Use dedicated prober sidecar instead
      - SCENARIO=${SCENARIO:-congested_low}
      - ML_AGENT=${ML_AGENT:-default}  # Q-learning agent: 'default' or 'andy'
      - CLEAR_QTABLE=${CLEAR_QTABLE:-}  # Set to '1' to clear Q-table checkpoint
      - TZ=America/Los_Angeles
      - SERVER_CONTROL_URL=http://192.168.200.10:9001  # Forward slider cmds to server bottleneck
    command: python -m main clients --server 192.168.200.10 --duration ${DURATION:-30} --scenario ${SCENARIO:-congested_low} --output-dir output --with-ml --ml-agent ${ML_AGENT:-default} --ui

  # Network RTT prober sidecar - independent control-plane probe
  prober:
    image: quic-wireless
    container_name: quic-prober
    depends_on:
      - server
    networks:
      quic-net:
        ipv4_address: 192.168.200.30
    volumes:
      - ./results:/app/3_conn_code/output
    environment:
      - SCENARIO=${SCENARIO:-congested_low}
      - TZ=America/Los_Angeles
    command: python -m main probe --target 192.168.200.10 --duration ${DURATION:-30} --interval 0.5 --scenario ${SCENARIO:-congested_low} --output-dir output

networks:
  quic-net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.200.0/24
